name: CI
# Runs on every push and pull request. A PR cannot be merged (once branch protection is on)
# until this is green. This is the automated half of "no security loopholes, doesn't lag" —
# it can't catch everything, but it stops broken or unlinted code, and a failing type check,
# from ever reaching main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit dependencies (high severity and above)
        run: npm audit --audit-level=high
        continue-on-error: true # report but don't block yet — flip to blocking once the team is used to fixing these promptly
